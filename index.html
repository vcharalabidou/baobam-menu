<!--
  ΣΥΝΤΗΡΗΣΗ ΜΕΝΟΥ
  • Προϊόντα και τιμές: αναζητήστε το όνομα του προϊόντος παρακάτω (Ctrl+F).
  • item-name = όνομα, item-desc = περιγραφή, price = τιμή.
  • Φωτογραφίες: βρίσκονται στον φάκελο images. Το src δείχνει το αρχείο κάθε προϊόντος.
  • Αγγλικά: οι μεταφράσεις βρίσκονται στο translations.js.
  • Το ίδιο προϊόν μπορεί να υπάρχει σε περισσότερες κατηγορίες: ενημερώστε κάθε εμφάνιση.
  Μετά τις αλλαγές, αποθηκεύστε και ανανεώστε τη σελίδα για έλεγχο σε EL και EN.
-->

  <style>
    /* ====== ΒΑΣΙΚΑ ====== */
    body {
      margin: 0;

      background: #000; /* ΜΑΥΡΟ ΦΟΝΤΟ */

    /* ====== LOGO ====== */

    /* ====== ΚΟΥΜΠΑΚΙΑ ΚΑΤΗΓΟΡΙΩΝ ====== */
   
.category-scroll {
  /* Η μπάρα μένει στην κορυφή όσο κατεβαίνουμε στο μενού. */
  position: sticky;
  top: 0;
  z-index: 20;
  background: #000;
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.65);
  display: flex;
  align-items: center;
  max-width: 920px;
  margin: 0 auto 30px;
  padding: 0 44px;
}

.categories {
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  white-space: nowrap;   /* 👈 όλα σε μία σειρά */
  padding: 10px 15px;
  scrollbar-width: none;
  scroll-behavior: smooth;
  cursor: grab;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories.dragging {
  cursor: grabbing;
  scroll-behavior: auto;
}

.category-arrow {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 34px;
  height: 34px;
  border: 2px solid #e60000;
  border-radius: 50%;
  background: #e60000;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
}

.category-arrow.left {
  left: 6px;
  transform: translateY(-50%);
}

.category-arrow.right {
  right: 6px;
  transform: translateY(-50%);
}

.category-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}

@media (max-width: 520px) {
  .category-scroll {
    padding: 0;
  }

  .category-arrow {
    display: none;
  }
}


    

.category-btn {
  display: inline-block;   /* 👈 ΟΧΙ flex */

  border: 2px solid #e60000;

  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
  margin-right: 10px;      /* 👈 απόσταση μεταξύ κουμπιών */
}

    .menu-badge {
      display: inline-flex;

      text-align: center;
      text-transform: uppercase;
      transform: rotate(-4deg);
    }

    .menu-badge::before,
    .menu-badge::after {
      content: "";
      position: absolute;
      inset: 0;

     */
    }
    .prices {
      margin-top: 6px;
    }


  
  
    .language-toggle {

    /* Κουμπί αντιγραφής τηλεφώνου. Κρύβεται σε οθόνες έως 767px. */

  <script>
    // Αριθμός για αντιγραφή. Ενημερώστε όλες τις εμφανίσεις του εδώ και το κουμπί href="tel:..." επάνω.
    async function copyStorePhone() {
      const status = document.getElementById('phone-copy-status');
      try {
        await navigator.clipboard.writeText('2104658767');
        status.textContent = currentLanguage === 'en' ? 'Phone number copied.' : 'Ο αριθμός αντιγράφηκε.';
      } catch {
        status.textContent = currentLanguage === 'en' ? 'Select and copy this number: 2104658767' : 'Επιλέξτε και αντιγράψτε τον αριθμό: 2104658767';
      }
    }
    const menu = document.getElementById('menu');
    const buttons = document.querySelectorAll('.category-btn');
    const categories = document.getElementById('categories');
    const categoryLeftArrow = document.querySelector('.category-arrow.left');
    const categoryRightArrow = document.querySelector('.category-arrow.right');

    // Απενεργοποιεί τα βελάκια όταν φτάνουμε στην αρχή ή στο τέλος των κατηγοριών.
    function updateCategoryArrows() {
      if (!categories || !categoryLeftArrow || !categoryRightArrow) return;

      const maxScroll = categories.scrollWidth - categories.clientWidth;
      categoryLeftArrow.disabled = categories.scrollLeft <= 2;
      categoryRightArrow.disabled = categories.scrollLeft >= maxScroll - 2;
    }

    function scrollCategories(direction) {
      if (!categories) return;

      categories.scrollBy({
        left: direction * Math.round(categories.clientWidth * 0.75),
        behavior: 'smooth'
      });

      setTimeout(updateCategoryArrows, 350);
    }

    if (categories) {
      let isDraggingCategories = false;
      let dragStartX = 0;
      let dragStartScroll = 0;

      categories.addEventListener('scroll', updateCategoryArrows);

      categories.addEventListener('wheel', function (event) {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

        event.preventDefault();
        categories.scrollLeft += event.deltaY;
      }, { passive: false });

      categories.addEventListener('pointerdown', function (event) {
        if (event.target.closest('.category-btn')) return;

        isDraggingCategories = true;
        dragStartX = event.clientX;
        dragStartScroll = categories.scrollLeft;
        categories.classList.add('dragging');
        categories.setPointerCapture(event.pointerId);
      });

      categories.addEventListener('pointermove', function (event) {
        if (!isDraggingCategories) return;
        categories.scrollLeft = dragStartScroll - (event.clientX - dragStartX);
      });

      categories.addEventListener('pointerup', function (event) {
        if (!isDraggingCategories) return;

        isDraggingCategories = false;
        categories.classList.remove('dragging');
        categories.releasePointerCapture(event.pointerId);
      });

      categories.addEventListener('pointercancel', function () {
        isDraggingCategories = false;
        categories.classList.remove('dragging');
      });

      window.addEventListener('resize', updateCategoryArrows);
    }

    function resetButtons() {
      buttons.forEach(btn => btn.classList.remove('active'));
    }

    // Ανοίγει μία κατηγορία και καθαρίζει την αναζήτηση. Στην κύλιση επιστρέφει στην αρχή των προϊόντων.
    function showCategory(category, btn) {
    const categoryBar = document.querySelector('.category-scroll');
    const returnToMenuStart = categoryBar.getBoundingClientRect().top <= 0;
    resetButtons();
    
 if (btn) {
        btn.classList.add('active');
      }

      menu.style.display = 'block';
      document.getElementById('menu-search-input').value = '';
      document.getElementById('clear-search').hidden = true;
      document.getElementById('search-status').textContent = '';
      selectedCategory = category;
      menu.innerHTML = getCategoryMarkup(category);
      applyMenuLanguage();
      if (returnToMenuStart) {
        window.scrollTo({ top: Math.max(0, window.scrollY + menu.getBoundingClientRect().top - categoryBar.offsetHeight - 12), behavior: 'instant' });
      }
    }

    // ΠΡΟΪΟΝΤΑ ΑΝΑ ΚΑΤΗΓΟΡΙΑ — εδώ αλλάζουν ονόματα, περιγραφές και τιμές.

    // Η αναζήτηση διαβάζει αυτόματα τα προϊόντα όλων των κατηγοριών — δεν χρειάζεται δεύτερη λίστα.
    let selectedCategory = 'bao';
    let searchIndex;
    // Αγνοούμε τόνους, κεφαλαία και τη διαφορά σ/ς στην αναζήτηση.
    function normalizeSearch(text) {
      return text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ς/g, 'σ');
    }
    // Ετοιμάζει ονόματα και υλικά στα ελληνικά και αγγλικά μία φορά ανά φόρτωση της σελίδας.
    function getSearchIndex() {
      if (searchIndex) return searchIndex;
      searchIndex = [...buttons].map(button => {
        const category = button.getAttribute('onclick').match(/showCategory\('([^']+)'/)[1];
        const template = document.createElement('template');
        template.innerHTML = getCategoryMarkup(category);
        return { label: (originalTexts.get(button.firstChild) || button.textContent).trim(), items: [...template.content.querySelectorAll('.item')].filter(item => item.querySelector('.item-name')).map(item => {
          const text = [...item.querySelectorAll('.item-name, .item-desc')].map(node => node.textContent).join(' ');
          return { html: item.outerHTML, text: normalizeSearch(text + ' ' + translateMenuText(text)) };
        }) };
      });
      return searchIndex;
    }
    // Το «Καθαρισμός» επαναφέρει την τελευταία επιλεγμένη κατηγορία.
    function clearMenuSearch() {
      const button = [...buttons].find(button => button.getAttribute('onclick').includes("'" + selectedCategory + "'"));
      showCategory(selectedCategory, button);
      document.getElementById('menu-search-input').focus({ preventScroll: true });
    }
    // Εμφανίζει τα αποτελέσματα ανά κατηγορία, μαζί με φωτογραφίες, τιμές και ενδείξεις.
    function searchMenu() {
      const query = document.getElementById('menu-search-input').value.trim();
      if (!query) { clearMenuSearch(); return; }
      document.getElementById('clear-search').hidden = false;
      resetButtons();
      const terms = normalizeSearch(query).split(/\s+/);
      const fragment = document.createDocumentFragment();
      let count = 0;
      getSearchIndex().forEach(group => {
        const matches = group.items.filter(item => terms.every(term => item.text.includes(term)));
        if (!matches.length) return;
        const heading = document.createElement('h2');
        heading.className = 'subcategory';
        heading.textContent = group.label;
        fragment.append(heading);
        matches.forEach(item => {
          const template = document.createElement('template');
          template.innerHTML = item.html;
          fragment.append(template.content);
          count++;
        });
      });
      menu.replaceChildren(fragment);
      menu.style.display = 'block';
      document.getElementById('search-status').textContent = currentLanguage === 'en'
        ? (count ? `Results: ${count}` : 'No products found. Try another name or ingredient.')
        : (count ? `Αποτελέσματα: ${count}` : 'Δεν βρέθηκαν προϊόντα. Δοκιμάστε άλλο όνομα ή υλικό.');
      applyMenuLanguage();
    }
    // Η πρώτη κατηγορία που εμφανίζεται όταν ανοίγει η σελίδα είναι τα Bao Buns.
    window.onload = function () {
      const baoBtn = document.getElementById('btn-bao');
      showCategory('bao', baoBtn);
      updateCategoryArrows();
    };
  </script>
