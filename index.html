  <style>
    /* ====== ΒΑΣΙΚΑ ====== */
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #000; /* ΜΑΥΡΟ ΦΟΝΤΟ */
      color: #e60000; /* ΚΟΚΚΙΝΑ ΓΡΑΜΜΑΤΑ */

    /* ====== LOGO ====== */
    #logo {

    h1 {

      font-size: 32px;
      letter-spacing: 2px;
    }

    /* ====== ΚΟΥΜΠΑΚΙΑ ΚΑΤΗΓΟΡΙΩΝ ====== */
   
.category-scroll {
  position: relative;
  display: flex;
  align-items: center;
  max-width: 920px;
  margin: 0 auto 30px;
  padding: 0 44px;
}

.categories {
  flex: 1;
  overflow-x: auto;
  white-space: nowrap;   /* 👈 όλα σε μία σειρά */
  padding: 10px 15px;
  scrollbar-width: none;
  scroll-behavior: smooth;
  cursor: grab;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories.dragging {
  cursor: grabbing;
  scroll-behavior: auto;
}

.category-arrow {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 34px;
  height: 34px;
  border: 2px solid #e60000;
  border-radius: 50%;
  background: #e60000;
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
}

.category-arrow.left {
  left: 6px;
  transform: translateY(-50%);
}

.category-arrow.right {
  right: 6px;
  transform: translateY(-50%);
}

.category-arrow:disabled {
  opacity: 0.35;
  cursor: default;
}

@media (max-width: 520px) {
  .category-scroll {
    padding: 0;
  }

  .category-arrow {
    display: none;
  }
}


    

.category-btn {
  display: inline-block;   /* 👈 ΟΧΙ flex */
  background: #fff;
  color: #e60000;
  border: 2px solid #e60000;
  border-radius: 999px;    /* 👈 full oval */
  padding: 10px 22px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
  margin-right: 10px;      /* 👈 απόσταση μεταξύ κουμπιών */
}

    .category-btn.active {
      background: #e60000;
      color: #fff;
    }

    /* ====== ΠΕΡΙΟΧΗ ΜΕΝΟΥ ====== */
    #menu {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 0 15px;
      display: none; /* ΔΕΝ ΦΑΙΝΕΤΑΙ ΑΝ ΔΕΝ ΠΑΤΗΘΕΙ ΚΑΤΗΓΟΡΙΑ */
    }

    /* ====== ΥΠΟΚΑΤΗΓΟΡΙΕΣ ====== */
    .subcategory {
      display: inline-block; /* να αγκαλιάζει τα γράμματα */
      background: #e60000;
      color: #fff;
      padding: 8px 14px;
      margin: 30px 0 15px;
      font-size:30px;
      text-align: left;
      transform: rotate(4deg); /* λοξό προς τα δεξιά */
    }

    /* ====== ΠΡΟΪΟΝ ====== */
    .item {
      text-align: left;
      margin-bottom: 28px;
    }

    .item-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .item-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .item-title .item-name {
      margin-bottom: 0;
    }

    .menu-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 78px;
      height: 58px;
      padding: 8px 10px;
      background: transparent;
      color: #050505;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(-4deg);
    }

    .menu-badge::before,
    .menu-badge::after {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 58% 19%, 77% 7%, 75% 29%, 98% 31%, 81% 46%, 96% 63%, 73% 66%, 81% 90%, 59% 80%, 50% 100%, 41% 80%, 19% 90%, 27% 66%, 4% 63%, 19% 46%, 2% 31%, 25% 29%, 23% 7%, 42% 19%);
    }

    .menu-badge::before {
      background: #ff2a00;
      z-index: 0;
    }

    .menu-badge::after {
      background: #ffd51d;
      inset: 6px;
      z-index: 1;
    }

    .menu-badge > * {
      position: relative;
      z-index: 2;
      transform: translateY(-2px);
    }

    .menu-badge.hot {
      width: 102px;
      height: 62px;

    function updateCategoryArrows() {
      if (!categories || !categoryLeftArrow || !categoryRightArrow) return;

      const maxScroll = categories.scrollWidth - categories.clientWidth;
      categoryLeftArrow.disabled = categories.scrollLeft <= 2;
      categoryRightArrow.disabled = categories.scrollLeft >= maxScroll - 2;
    }

    function scrollCategories(direction) {
      if (!categories) return;

      categories.scrollBy({
        left: direction * Math.round(categories.clientWidth * 0.75),
        behavior: 'smooth'
      });

      setTimeout(updateCategoryArrows, 350);
    }

    if (categories) {
      let isDraggingCategories = false;
      let dragStartX = 0;
      let dragStartScroll = 0;

      categories.addEventListener('scroll', updateCategoryArrows);

      categories.addEventListener('wheel', function (event) {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;

        event.preventDefault();
        categories.scrollLeft += event.deltaY;
      }, { passive: false });

      categories.addEventListener('pointerdown', function (event) {
        if (event.target.closest('.category-btn')) return;

        isDraggingCategories = true;
        dragStartX = event.clientX;
        dragStartScroll = categories.scrollLeft;
        categories.classList.add('dragging');
        categories.setPointerCapture(event.pointerId);
      });

      categories.addEventListener('pointermove', function (event) {
        if (!isDraggingCategories) return;
        categories.scrollLeft = dragStartScroll - (event.clientX - dragStartX);
      });

      categories.addEventListener('pointerup', function (event) {
        if (!isDraggingCategories) return;

        isDraggingCategories = false;
        categories.classList.remove('dragging');
        categories.releasePointerCapture(event.pointerId);
      });

      categories.addEventListener('pointercancel', function () {
        isDraggingCategories = false;
        categories.classList.remove('dragging');
      });

      window.addEventListener('resize', updateCategoryArrows);
    }
